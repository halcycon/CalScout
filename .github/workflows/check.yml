name: Check and package
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ''
    outputs:
      version:
        description: Validated extension version
        value: ${{ jobs.check.outputs.version }}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check scripts tests
      - run: ruff format --check scripts tests
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build installable XPI
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            npm run build -- --tag "$RELEASE_TAG"
          else
            npm run build
          fi
      - name: Read validated version
        id: metadata
        run: python -c 'import json; print("version=" + json.load(open("src/manifest.json"))["version"])' >> "$GITHUB_OUTPUT"
      - name: Verify reproducibility and checksum
        run: |
          cp dist/SHA256SUMS /tmp/calscout-xpi.sha256
          npm run build
          cd dist
          sha256sum --check /tmp/calscout-xpi.sha256
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: calscout-xpi
          path: |
            dist/*.xpi
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
