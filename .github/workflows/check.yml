name: Check and package
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ''
    outputs:
      version:
        description: Validated extension version
        value: ${{ jobs.check.outputs.version }}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check scripts tests
      - run: ruff format --check scripts tests
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build installable XPI
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            npm run build -- --tag "$RELEASE_TAG"
          else
            npm run build
          fi
      - name: Read validated version
        id: metadata
        run: python -c 'import json; print("version=" + json.load(open("src/manifest.json"))["version"])' >> "$GITHUB_OUTPUT"
      - name: Verify reproducibility and checksum
        run: |
          cp dist/SHA256SUMS /tmp/calscout-xpi.sha256
          npm run build
          cd dist
          sha256sum --check /tmp/calscout-xpi.sha256
          sha256sum --check SHA256SUMS
      - name: Build ATN submission packet from committed source
        run: npm run build:submission
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calscout-xpi
          path: |
            dist/*.xpi
            dist/*.zip
            dist/ATN_SHA256SUMS
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Verify downloadable build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: calscout-xpi
          path: ${{ runner.temp }}/calscout-installable
      - name: Check downloaded artifact checksum
        working-directory: ${{ runner.temp }}/calscout-installable
        run: |
          sha256sum --check SHA256SUMS
          sha256sum --check ATN_SHA256SUMS
