name: Check and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify reproducibility
        run: |
          sha256sum dist/*.xpi > /tmp/calscout-xpi.sha256
          npm run build
          sha256sum --check /tmp/calscout-xpi.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: calscout-development-xpi
          path: dist/*.xpi
