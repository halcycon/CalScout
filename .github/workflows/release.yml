name: Publish extension
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/check.yml
    with:
      release_tag: ${{ github.ref_name }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: calscout-xpi
          path: dist
      - name: Verify release files
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$state" != true ]]; then
              echo 'A published release already exists; refusing to replace its assets.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "CalScout $VERSION" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.xpi dist/SHA256SUMS --clobber
          if [[ "$VERSION" == 0.* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
